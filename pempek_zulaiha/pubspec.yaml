name: pempek_zulaiha
description: Aplikasi jual beli Pempek Zulaiha secara online
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.6.0                 # untuk request ke API PHP
  shared_preferences: ^2.5.5   # simpan status login/guest
  geolocator: ^13.0.1         # ambil koordinat GPS
  geocoding: ^3.0.0            # opsional: ubah koordinat jadi alamat
  sqflite: ^2.4.2+1
  path: ^1.9.1
  url_launcher: ^6.3.2
  image_picker: ^1.0.4
  file_picker: ^8.1.2
  get: ^4.6.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true